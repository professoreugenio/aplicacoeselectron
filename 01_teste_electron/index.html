<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Estoque | Aula 01</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="cabecalho">
    <h1>📦 Sistema de Controle de Estoque</h1>
    <p>Projeto Integrador — Aula 01</p>
  </header>
  <main class="conteudo">
    <section aria-labelledby="titulo-inicial">
      <h2 id="titulo-inicial">Bem-vindo!</h2>
      <p>Esta é a primeira versão desktop do sistema.</p>
      <button id="btnTeste" type="button">Testar JavaScript</button>
      <p id="mensagem" role="status" aria-live="polite">Aguardando teste...</p>
    </section>
    <section aria-labelledby="titulo-modulos">
      <h2 id="titulo-modulos">Módulos previstos</h2>
      <ul><li>Cadastro de categorias</li><li>Cadastro de produtos</li><li>Entradas e saídas</li><li>Relatórios</li></ul>
    </section>
  </main>
  <footer class="rodape">Versão didática 0.1 — Ainda sem conexão ao MySQL</footer>
</body>
</html>
