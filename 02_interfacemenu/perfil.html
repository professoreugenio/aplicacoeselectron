<form id="formSenha">
  <label for="senhaAtual">
    Senha atual
  </label>
  <input id="senhaAtual"
         type="password"
         required>

  <label for="senhaNova">
    Nova senha
  </label>
  <input id="senhaNova"
         type="password"
         minlength="12"
         required>

  <label for="senhaConfirma">
    Confirmar nova senha
  </label>
  <input id="senhaConfirma"
         type="password"
         minlength="12"
         required>

  <button type="submit">
    Alterar senha
  </button>
</form>
